    - "https://doh.pub/dns-query#DIRECT&disable-qtype-65=true"

  direct-nameserver-follow-policy: false

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver-policy:
    "rule-set:private_domain,cn_domain,steam_cn,apple_cn_domain":
      - "https://dns.alidns.com/dns-query#DIRECT&disable-qtype-65=true"
      - "https://doh.pub/dns-query#DIRECT&disable-qtype-65=true"

    "rule-set:ai,geolocation-!cn,google_domain,youtube_domain,github_domain,telegram_domain,netflix_domain,tiktok_domain":
      - "https://1.1.1.1/dns-query#Proxy&disable-qtype-65=true"
      - "https://1.0.0.1/dns-query#Proxy&disable-qtype-65=true"

