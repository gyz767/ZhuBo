port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
unified-delay: true
sniffer:
  sniff:
    TLS: {ports: [443], override-destination: true}
    HTTP: {ports: [443], override-destination: true}
  enable: true
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
  parse-pure-ip: false
  force-dns-mapping: true
  override-destination: true
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  fake-ip-filter:
    - "*.lan"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - xbox.*.microsoft.com
    - "*.xboxlive.com"
    - "*.teafone.com"
    - "*.sktswe.net"
    - rtc.goodfone.co.kr
    - "*.chattti.com"

  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 223.6.6.6
    - "2402:4e00::"
    - "2400:3200::1"
  
  fallback:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - "2606:4700:4700::1111"
    - "2001:4860:4860::8888"
