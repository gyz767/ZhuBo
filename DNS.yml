port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: false
unified-delay: true
mode: rule
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
  sniff-tls-sni: true
  protocol-sniffer:
    enable: true
    force-domain:
      - turn.icf-prod-sound.generflow.com
      - +.generflow.com
      - +.streamatemodels.com
    sniff:
      TLS:
        ports: [443, 8443]
      HTTP:
        ports: [80, 8080-8888]
      QUIC:
        ports: [443, 8443]
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  fake-ip-filter:
    - "*.lan"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - xbox.*.microsoft.com
    - "*.xboxlive.com"
    - "*.teafone.com"
    - "*.sktswe.net"
    - rtc.goodfone.co.kr
    - "*.chattti.com"

  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 223.6.6.6
    - "2402:4e00::"
    - "2400:3200::1"
  
  fallback:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - "2606:4700:4700::1111"
    - "2001:4860:4860::8888"
